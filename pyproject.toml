[project]
name = "gemini-router"
version = "0.14.1"
description = "Quota-aware Gemini router with persistent usage ledger, native API proxy, TTS and auto-updating CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "vernikr" }]
keywords = ["gemini", "router", "quota", "rate-limit", "llm", "mcp", "tracing"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/vernikr/gemini-router"
Repository = "https://github.com/vernikr/gemini-router"
Changelog = "https://github.com/vernikr/gemini-router/blob/main/CHANGELOG.md"

[project.scripts]
gemini-router = "gemini_router.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_router"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gemini_router",
    "tests",
    "docs",
    "scripts",
    "packaging",
    "npm",
    ".github/workflows",
    "README.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "config.example.yaml",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
