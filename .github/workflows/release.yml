name: release
# Publish the tagged commit to PyPI and npm. The tag, pyproject.toml and
# npm/package.json carry the same version; the lockstep guards enforce it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: python3 scripts/check_secrets.py
      - run: uv run ruff check .
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
        working-directory: npm
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; \
          else v="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Lockstep guard — pyproject version must equal the tag
        run: grep -q "^version = \"${{ steps.ver.outputs.version }}\"$" pyproject.toml
      - run: rm -rf dist && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Lockstep guard — npm version must equal the PyPI version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test "$(node -p "require('./npm/package.json').version")" = "$v"
      - run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    name: Deploy to VPS
    needs: [pypi, npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: gemini-router-production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy published version
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]
          version="${BASH_REMATCH[1]}"
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "root@$VPS_HOST" "deploy gemini-router $version"
