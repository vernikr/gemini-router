name: tariff-drift
# Wave 1 layer 3: the scheduled proof that MEDIA_TARIFFS still matches the provider.
# Uploads three generated fixtures and calls countTokens on each — both free, no RPD —
# then fails on any mismatch. A red run is itself a signal (GitHub notifies); the mail
# path is the durable one (Gmail SMTP from Actions, the pattern tldr-digest proved).
# Needs repo secrets: GEMINI_API_KEY; for mail GMAIL_ADDRESS / GMAIL_APP_PASSWORD / MAIL_TO.
on:
  schedule:
    - cron: "17 6 * * 1"          # Mondays; countTokens draws no quota, any hour is cheap
  workflow_dispatch: {}
  release:
    types: [published]            # every release re-verifies the table it ships
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Measure the live tariffs against the table
        run: uv run python scripts/tariff_check.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
