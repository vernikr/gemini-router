name: ci
# Tags are the release workflow's business: on a tag `release.test` runs the same checks
# over the same commit, so triggering here too spent a duplicate job per release. Feature
# branches are covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: python3 scripts/check_secrets.py   # fixtures carry DUMMY, never a live key
      - run: uv run ruff check .
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: npm
